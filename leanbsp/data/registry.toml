# Built-in list of known BSPs. A BSP is named after its board; the MCU goes in tags.
# Extra registry files (~/.config/lean-bsp/registry.d/*.toml, LEAN_BSP_REGISTRY) are
# merged on top, an extra entry winning on a name collision.

[[bsp]]
name = "linux-host"
git = "https://github.com/sebastien-riou/lean-bsp-linux-host.git"
description = "Run/debug apps as a native Linux process; day-1 cross-platform target"
tags = ["host", "linux", "native"]

